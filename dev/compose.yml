name: owlrora-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OWLRORA_DEV_POSTGRES_DB:-owlrora}
      POSTGRES_USER: ${OWLRORA_DEV_POSTGRES_USER:-owlrora}
      POSTGRES_PASSWORD: ${OWLRORA_DEV_POSTGRES_PASSWORD:-owlrora_dev}
    ports:
      - "${OWLRORA_DEV_POSTGRES_HOST:-127.0.0.1}:${OWLRORA_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql --host=127.0.0.1 --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}" --no-psqlrc --set=ON_ERROR_STOP=1
          --command='SELECT 1' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    ports:
      - "${OWLRORA_DEV_REDIS_HOST:-127.0.0.1}:${OWLRORA_DEV_REDIS_PORT:-56379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
