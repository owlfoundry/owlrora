name: Release Server

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish owlrora-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifest
        run: python3 scripts/release/prepare_release.py
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/release/publish-crate.sh \
            crates/owlrora-server/Cargo.toml "${VERSION#server-v}"
