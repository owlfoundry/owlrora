name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: owlrora
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: owlrora
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: owlrora
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: owlrora
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: owlrora.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain stable
      - name: Build CLI binary
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo build --release --locked --package owlrora-cli --target "${{ matrix.target }}"
      - name: Package Unix CLI
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          archive="owlrora-cli-${version}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" owlrora
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          archive="owlrora-cli-${version}-${TARGET}.zip"
          powershell -NoProfile -NonInteractive -Command \
            "Compress-Archive -LiteralPath 'target/$TARGET/release/owlrora.exe' -DestinationPath '$archive'"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: owlrora-cli-${{ matrix.target }}
          path: owlrora-cli-*-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish CLI crate and release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare release manifests
        run: python3 scripts/release/prepare_release.py
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: owlrora-cli-*
          path: artifacts
          merge-multiple: true
      - name: Verify artifact set and create checksums
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          expected=(
            "owlrora-cli-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "owlrora-cli-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "owlrora-cli-${version}-x86_64-apple-darwin.tar.gz"
            "owlrora-cli-${version}-aarch64-apple-darwin.tar.gz"
            "owlrora-cli-${version}-x86_64-pc-windows-msvc.zip"
          )
          for asset in "${expected[@]}"; do test -f "artifacts/$asset"; done
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          (cd artifacts && sha256sum owlrora-cli-* > SHA256SUMS)
      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish CLI crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          scripts/release/publish-crate.sh \
            crates/owlrora-cli/Cargo.toml "$version"
      - name: Create CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          release_args=(--generate-notes --title "OwlRora CLI v${version}")
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* "${release_args[@]}"
