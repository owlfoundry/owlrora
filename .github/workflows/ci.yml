name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check web sources
        run: pnpm check
      - name: Test web sources
        run: pnpm test
      - name: Build embedded web assets
        run: pnpm build
      - name: Verify embedded assets are current
        run: |
          git diff --exit-code -- crates/owlrora-server/web/dist
          test -z "$(git ls-files --others --exclude-standard -- crates/owlrora-server/web/dist)"
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust sources
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust sources
        run: cargo test --workspace --all-features --locked
      - name: Verify server crate package
        run: scripts/test-server-package.sh
      - name: Build server
        run: cargo build --release --locked --package owlrora-server

  server-image:
    name: Server image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build server image
        run: |
          docker build \
            --build-arg OWLRORA_VERSION=ci \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag owlrora:ci \
            .
      - name: Smoke-test server image
        run: scripts/docker/smoke-server-image.sh owlrora:ci
