[package]
name = "owlrora-cli"
version = "0.0.0-dev"
edition.workspace = true
description = "Command-line interface for OwlRora"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "gateway", "management", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "owlrora"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
flate2 = "1.1.9"
fs2 = "0.4.3"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls"] }
self-replace = "1.5.0"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
