[package]
name = "owlrora-server"
version = "0.0.0-dev"
edition.workspace = true
description = "Identity and management server for the OwlRora AI gateway"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "gateway", "observability", "self-hosted"]
categories = ["web-programming::http-server"]
include = ["src/**", "web/dist/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "owlrora-server"
path = "src/main.rs"

[dependencies]
arc-swap = "1.8.1"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
crc32fast = "1.5.0"
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.4.0"
httpdate = "1.0.3"
ipnet = "2.11.0"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
mime_guess = "2.0.5"
owlrora-key-provider = { version = "=0.0.0-dev", path = "../owlrora-key-provider" }
rand = "0.9.2"
futures-util = "0.3.31"
reqsign = { version = "0.20.0", default-features = true, features = ["aws", "google"] }
reqsign-http-send-reqwest = "4.0.5"
reqwest = { version = "0.13.1", default-features = false, features = ["form", "json", "rustls", "stream"] }
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }
deadpool-redis = { version = "0.23.0", default-features = false, features = ["rt_tokio_1", "tls-rustls-webpki-roots", "script"] }
redis = { version = "1.5.0", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "script"] }

[dev-dependencies]
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
rcgen = { version = "0.14.5", features = ["aws_lc_rs"] }
tokio-rustls = "0.26.4"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
