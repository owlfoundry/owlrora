[package]
name = "owlrora-server"
version = "0.0.0-dev"
edition.workspace = true
description = "Identity and management server for the OwlRora AI gateway"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "gateway", "observability", "self-hosted"]
categories = ["web-programming::http-server"]
include = ["src/**", "web/dist/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "owlrora-server"
path = "src/main.rs"

[dependencies]
arc-swap = "1.8.1"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
hkdf = "0.12.4"
http = "1.4.0"
ipnet = "2.11.0"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
mime_guess = "2.0.5"
owlrora-key-provider = { version = "=0.0.0-dev", path = "../owlrora-key-provider" }
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false, features = ["form", "json", "rustls"] }
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "cors", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
